name: Deploy server

# Only server changes need a deploy; plugin-only commits are installed by
# developers from the marketplace, not from this box.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

# Authentication is a short-lived SSH certificate issued by the host's own
# step-ca, in exchange for this run's GitHub OIDC token. There is no deploy key
# and no repository secret: the certificate is valid for minutes and is bound to
# this workflow run.
permissions:
  id-token: write
  contents: read

# Deployment target lives in repository variables, not in this file - the repo
# is public. Settings > Secrets and variables > Actions > Variables:
#   CA_URL, CA_FINGERPRINT, CA_PROVISIONER, DEPLOY_HOST, DEPLOY_USER
# None of these are secrets; the fingerprint is what pins the CA.
env:
  CA_URL: ${{ vars.CA_URL }}
  CA_FINGERPRINT: ${{ vars.CA_FINGERPRINT }}
  CA_PROVISIONER: ${{ vars.CA_PROVISIONER || 'github' }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Not an error: the host also pulls origin/main on a timer, so a repo
      # without a configured target still deploys. Skip rather than fail.
      - name: Check the deploy target is configured
        id: cfg
        run: |
          if [ -z "${CA_URL}" ] || [ -z "${CA_FINGERPRINT}" ] || [ -z "${DEPLOY_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deploy target configured (repository variables CA_URL, CA_FINGERPRINT, DEPLOY_HOST). The host pulls origin/main on a timer, so this commit still deploys."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a short-lived SSH certificate via OIDC
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail

          # Fetch the CA root and pin it by fingerprint, so everything below
          # talks to a verified CA without trusting the runner's trust store.
          curl -fsSk "${CA_URL}/roots" | jq -r '.crts[0]' > /tmp/root_ca.crt
          GOT="$(openssl x509 -in /tmp/root_ca.crt -outform DER \
                 | openssl dgst -sha256 -hex | awk '{print $NF}')"
          if [ "$GOT" != "$CA_FINGERPRINT" ]; then
            echo "::error::CA root fingerprint mismatch. expected $CA_FINGERPRINT got $GOT"
            exit 1
          fi
          echo "CA root verified against pinned fingerprint"

          # GitHub's OIDC token for this run, with the audience the CA's
          # provisioner expects.
          ID_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CA_URL}" | jq -r '.value')"
          test -n "$ID_TOKEN" && test "$ID_TOKEN" != null \
            || { echo "::error::No OIDC token returned. Is 'permissions: id-token: write' set?"; exit 1; }

          # Show what the CA will be deciding on. These are the signed claims
          # GitHub asserts about this run; they are what the CA's template
          # allowlists against. Printing them is safe - the token itself is
          # never echoed, and it expires in minutes.
          payload="$(printf '%s' "$ID_TOKEN" | cut -d. -f2)"
          case $(( ${#payload} % 4 )) in 2) payload="$payload==";; 3) payload="$payload=";; esac
          echo "--- OIDC claims the CA authorises against:"
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, repository, repository_owner, sub, ref, workflow_ref, runner_environment}' \
            || echo "  (could not decode claims)"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C "github-actions-$GITHUB_RUN_ID" -f ~/.ssh/id_ed25519

          # Call the CA's SSH sign endpoint directly rather than via `step ssh
          # certificate`. The CLI treats --token as one of its own bootstrap
          # tokens and reads the root fingerprint from the token's "sha" claim;
          # a GitHub OIDC token carries "sha" = the commit SHA, so the CLI looks
          # for a root that does not exist and fails. The HTTP API has no such
          # ambiguity.
          PUBKEY="$(awk '{print $2}' ~/.ssh/id_ed25519.pub)"
          REQ="$(jq -cn --arg pk "$PUBKEY" --arg ott "$ID_TOKEN" \
                 '{publicKey:$pk, ott:$ott, certType:"user"}')"

          HTTP=$(curl -sS --cacert /tmp/root_ca.crt -o /tmp/sign.json -w '%{http_code}' \
            -X POST "${CA_URL}/ssh/sign" -H 'content-type: application/json' -d "$REQ")
          MSG="$(jq -r '.message // empty' /tmp/sign.json 2>/dev/null | head -3)"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::CA refused to sign (HTTP $HTTP): ${MSG:-no message}"
            exit 1
          fi

          CERT="$(jq -r '.crt' /tmp/sign.json)"
          test -n "$CERT" && test "$CERT" != null \
            || { echo "::error::CA response had no certificate: $(head -c 300 /tmp/sign.json)"; exit 1; }
          printf 'ssh-ed25519-cert-v01@openssh.com %s github-actions\n' "$CERT" > ~/.ssh/id_ed25519-cert.pub
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/id_ed25519-cert.pub

          echo "--- certificate issued:"
          ssh-keygen -L -f ~/.ssh/id_ed25519-cert.pub | grep -E 'Type|Valid|Principals|Key ID' -A1 | head -12

      - name: Deploy
        if: steps.cfg.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' < deploy/server-deploy.sh
