name: Deploy server

# Only server changes need a deploy; plugin-only commits are installed by
# developers from the marketplace, not from this box.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

# Authentication is a short-lived SSH certificate issued by the host's own
# step-ca, in exchange for this run's GitHub OIDC token. There is no deploy key
# and no repository secret: the certificate is valid for minutes and is bound to
# this workflow run.
permissions:
  id-token: write
  contents: read

env:
  CA_URL: https://REDACTED_HOST:9443
  CA_FINGERPRINT: REDACTED_FINGERPRINT
  CA_PROVISIONER: github
  DEPLOY_HOST: REDACTED_HOST
  DEPLOY_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install step CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/step.tar.gz \
            https://dl.smallstep.com/cli/docs-cli-install/latest/step_linux_amd64.tar.gz
          tar -xzf /tmp/step.tar.gz -C /tmp
          sudo install -m 0755 "$(find /tmp -type f -name step -perm -u+x | head -1)" /usr/local/bin/step
          step version

      - name: Get a short-lived SSH certificate via OIDC
        run: |
          set -euo pipefail
          # The audience must match the provisioner's clientID on the CA.
          ID_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${CA_URL}" | jq -r '.value')"
          test -n "$ID_TOKEN" && test "$ID_TOKEN" != null \
            || { echo "::error::No OIDC token returned. Is 'permissions: id-token: write' set?"; exit 1; }

          step ca bootstrap --ca-url "$CA_URL" --fingerprint "$CA_FINGERPRINT" --force

          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Pass the CA explicitly. step's flags also read environment
          # variables, and on a GitHub runner it otherwise picks up GITHUB_SHA
          # as the root fingerprint and fails looking for a root that does not
          # exist. env -u keeps that variable out of step's view entirely.
          env -u GITHUB_SHA -u SHA step ssh certificate \
            --ca-url "$CA_URL" \
            --root "$HOME/.step/certs/root_ca.crt" \
            --provisioner "$CA_PROVISIONER" \
            --token "$ID_TOKEN" \
            --insecure --no-password --force \
            "$DEPLOY_USER" ~/.ssh/id_ecdsa \
          || {
            echo "--- step config (for diagnosis; no secrets below)"
            cat "$HOME/.step/config/defaults.json" 2>/dev/null || true
            echo "--- step-related environment variable NAMES only"
            env | grep -oiE '^[A-Z_]*(STEP|FINGERPRINT|SHA)[A-Z_]*' | sort -u || true
            exit 1
          }

          echo "--- certificate issued:"
          ssh-keygen -L -f ~/.ssh/id_ecdsa-cert.pub | sed -n '1,12p'

      - name: Deploy
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ecdsa \
            "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' < deploy/server-deploy.sh
