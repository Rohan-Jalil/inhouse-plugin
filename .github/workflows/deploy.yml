name: Deploy server

# Only server changes need a deploy; plugin-only commits are installed by
# developers from the marketplace, not from this box.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          # Secrets are pasted by hand, so strip whitespace/newlines and strip a
          # scheme or user@ prefix if one crept in. Never echo the values.
          host="$(printf '%s' "${DEPLOY_HOST:-}" | tr -d '[:space:]')"
          host="${host#*://}"
          host="${host#*@}"
          host="${host%%/*}"
          host="${host%%:*}"
          user="$(printf '%s' "${DEPLOY_USER:-deploy}" | tr -d '[:space:]')"

          if [ -z "$host" ]; then
            echo "::error::DEPLOY_HOST secret is empty or unset"; exit 1
          fi
          if ! printf '%s' "$host" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::DEPLOY_HOST is not a bare hostname or IP after cleanup (length ${#host}). Set it to just the address, e.g. 203.0.113.10 — no scheme, port, user@, or quotes."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is empty or unset"; exit 1
          fi
          echo "target resolved (host length ${#host}, user length ${#user})"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077

          # Recover the key from a hand paste. Two things routinely contaminate
          # it: the host's SSH login banner copied along with the key, and
          # literal \n sequences instead of real newlines. Keep only the PEM
          # block, and unescape first if that block isn't there yet.
          write_key() { sed -n '/-----BEGIN/,/-----END/p' > ~/.ssh/id_ed25519; }

          printf '%s\n' "$DEPLOY_SSH_KEY" | write_key
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            printf '%b\n' "$DEPLOY_SSH_KEY" | write_key
          fi
          chmod 600 ~/.ssh/id_ed25519

          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            # Name the actual mistake instead of repeating generic advice.
            case "$DEPLOY_SSH_KEY" in
              ssh-ed25519*|ssh-rsa*|ecdsa-*)
                echo "::error::DEPLOY_SSH_KEY holds a PUBLIC key (it starts with ssh-ed25519). The public key belongs on the server, already installed. GitHub needs the PRIVATE key — the file WITHOUT the .pub extension." ;;
              *)
                echo "::error::DEPLOY_SSH_KEY has no -----BEGIN----- line ($(wc -l < ~/.ssh/id_ed25519) recovered). Re-copy the private key file in full, including its BEGIN and END lines." ;;
            esac
            echo "::error::Get it with:  ssh devflow-server 'cat ~/.ssh/github-actions-deploy' 2>/dev/null > deploy-key.txt   (the 2>/dev/null strips the host's login banner), then paste the whole file."
            exit 1
          fi
          echo "key parsed OK ($(ssh-keygen -lf ~/.ssh/id_ed25519 | awk '{print $1, $4}'))"

          ssh-keyscan -T 10 "$host" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${user}@${host}" 'bash -s' < deploy/server-deploy.sh
